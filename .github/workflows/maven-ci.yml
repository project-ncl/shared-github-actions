# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_call:
    # Map the inputs that the caller needs to provide
    inputs:
      java_version:
        description: "The Java version to use to compile. Default: 21"
        required: false
        type: string
        default: "21" # Java 21 is the default
      build_command:
        description: "The build command to use. Default: mvn clean install"
        required: false
        type: string
        default: "mvn -U -B -V clean install"
      fetch_all_commits:
        description: "Whether to fetch all commits. Default: false"
        required: false
        type: boolean
        default: false
      maven_version:
        description: "The Maven version to use. Default: 3.9.15"
        required: false
        type: string
        # Can't have dynamic default of the current version of Maven in the runner so hard-code it.
        default: "3.9.15"
      upload_artifacts:
        description: "Whether to upload artifacts and their metadata. Default: false"
        required: false
        type: boolean
        default: false
      pre_pull_docker_images:
        description: "Comma-separated list of Docker images to pull in the background before the build starts (e.g. images used by Testcontainers). Default: empty, nothing is pulled"
        required: false
        type: string
        default: ""

# cancel in-progress runs of the same workflow
# to avoid unnecessary runs when multiple commits pushed
# in a short period of time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.java_version }}-${{ inputs.maven_version }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_all_commits == true && '0' || '1' }}
          persist-credentials: false

      # Detached pulls carry on after this step ends, so they overlap with the Java/Maven setup and the build.
      # Failures are harmless: Testcontainers pulls any missing image itself when it is first needed.
      # Each pull writes <n>.log (image name on the first line, then the pull output) and, once finished,
      # <n>.rc (exit code and seconds taken). The 'Report Docker pre-pull results' step prints them.
      - name: Pre-pull Docker images in background
        if: inputs.pre_pull_docker_images != ''
        env:
          INPUTS_PRE_PULL_DOCKER_IMAGES: ${{ inputs.pre_pull_docker_images }}
        run: |
          mkdir -p -- "${RUNNER_TEMP}/pre-pull"
          n=0
          IFS=',' read -ra images <<< "${INPUTS_PRE_PULL_DOCKER_IMAGES}"
          for image in "${images[@]}"; do
            image="$(echo "${image}" | xargs)"
            [ -n "${image}" ] || continue
            if [[ ! "${image}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/:@-]*$ ]]; then
              echo "::warning::Skipping invalid Docker image name '${image}'"
              continue
            fi
            echo "Pre-pulling ${image} in background"
            base="${RUNNER_TEMP}/pre-pull/$((++n))"
            echo "${image}" > "${base}.log"
            # shellcheck disable=SC2016
            setsid bash -c 'docker pull -- "$1" >> "$2.log" 2>&1; echo "$? ${SECONDS}" > "$2.rc"' _ "${image}" "${base}" > /dev/null 2>&1 < /dev/null &
            disown
          done

      - uses: project-ncl/shared-github-actions/.github/actions/maven-build@e7102dd3bf74f91aaccae7a3539241c03a652d1a # v0.0.27
        with:
          java_version: ${{ inputs.java_version }}
          build_command: ${{ inputs.build_command }}
          maven_version: ${{ inputs.maven_version }}

      - name: Report Docker pre-pull results
        # Also on failure: a failed pre-pull can explain a slow or failing integration test
        if: always() && inputs.pre_pull_docker_images != ''
        run: |
          for log in "${RUNNER_TEMP}"/pre-pull/*.log; do
            [ -e "${log}" ] || continue
            image="$(head -n 1 "${log}")"
            rc="" secs=""
            [ ! -f "${log%.log}.rc" ] || read -r rc secs < "${log%.log}.rc"
            if [ "${rc}" = "0" ]; then
              echo "✅ Pre-pulled ${image} in ${secs}s"
            else
              status="${rc:+exit ${rc} after ${secs}s}"
              echo "::warning::❌ Pre-pull of ${image} did not succeed (${status:-still running}), Testcontainers pulls it on demand instead"
              echo "::group::Pre-pull log for ${image}"
              # Registry output is untrusted: stop it from being interpreted as workflow commands
              sed 's/::/: :/g' "${log}"
              echo "::endgroup::"
            fi
          done

      - name: Check for wrong code formatting
        # Straight after a maven-release the release plugin might have altered the format slightly. Don't fail
        # dependabot updates on formatting changes.
        if: github.actor != 'dependabot[bot]'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
              echo "Code formatting errors"
              echo "----------------------"
              git diff
              exit 1
          fi

      - name: Save PR metadata
        if: inputs.upload_artifacts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p pr-metadata
          echo "$PR_NUMBER" > pr-metadata/pr-number
          echo "$PR_SHA" > pr-metadata/pr-sha

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_artifacts
        with:
          name: pr-build
          path: |
            .
            !.git
            !pr-metadata
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_artifacts
        with:
          name: pr-metadata
          path: pr-metadata
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_artifacts
        with:
          name: pr-m2
          path: ~/.m2/repository/org/jboss/pnc/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1
