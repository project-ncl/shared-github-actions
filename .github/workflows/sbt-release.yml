name: SBT Release to Maven Central

on:
  workflow_call:
    inputs:
      project_name:
        description: "Name in <organisation>/<project_name> format. Prevents forks to run the job"
        required: true
        type: string

      ref_to_release:
        description: "Branch to release. Default: Github default branch"
        required: false
        type: string
        # default has to be a static string, no variables allowed
        default: ""

      release_version:
        description: "Version to release. Default: chosen by sbt-release (current version without -SNAPSHOT)"
        required: false
        type: string
        default: ""

      next_version:
        description: "Next snapshot version. Default: chosen by sbt-release (releaseVersionBump)"
        required: false
        type: string
        default: ""

      additional_release_args:
        description: "Extra sbt-release arguments, e.g. skip-tests"
        required: false
        type: string
        default: ""

      java_version:
        description: "The Java version to use to compile. Default: 8"
        required: false
        type: string
        default: "8"

      resolvers:
        description: "SBT resolvers to configure"
        required: false
        type: string
        default: |
          resolvers ++= Seq(
              "Sonatype Snapshots" at "https://central.sonatype.com/repository/maven-snapshots",
              "Artima" at "https://repo.artima.com/releases",
              "MRRC" at "https://maven.repository.redhat.com/ga/"
          )

      fetch_all_commits:
        description: "Whether to fetch all commits. Default: false"
        required: false
        type: boolean
        default: false

    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

# queue, don't cancel, a second release of the same ref: cancelling a run midway (e.g. after sonaRelease, before
# pushChanges) would leave a version published on Maven Central without its tag and version commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == inputs.project_name
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows pushing tags and commits

    env:
      FINAL_REF: ${{ inputs.ref_to_release || github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ env.FINAL_REF }}"
          fetch-depth: ${{ inputs.fetch_all_commits == true && '0' || '1' }}
          persist-credentials: false
          fetch-tags: true

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK '${{ inputs.java_version }}'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "${{ inputs.java_version }}"
          distribution: "temurin"
          cache: sbt
          # imports the key into the gpg keyring, used by sbt-pgp
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Setup SBT
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Configure Resolvers and Sonatype credentials
        shell: bash
        env:
          RESOLVERS: ${{ inputs.resolvers }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          mkdir -p "$HOME/.sbt/1.0"
          printf '%s\n' "$RESOLVERS" > "$HOME/.sbt/1.0/resolvers.sbt"
          printf '%s\n' \
          "realm=Sonatype Nexus Repository Manager" \
          "host=central.sonatype.com" \
          "user=$SONATYPE_USERNAME" \
          "password=$SONATYPE_PASSWORD" > "$HOME/.sbt/.credentials"

      - name: Set git remote to HTTPS token URL
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run sbt-release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_version }}
          ADDITIONAL_RELEASE_ARGS: ${{ inputs.additional_release_args }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          RELEASE_ARGS="with-defaults"
          if [ -n "${RELEASE_VERSION}" ]; then
            RELEASE_ARGS="${RELEASE_ARGS} release-version ${RELEASE_VERSION}"
          fi
          if [ -n "${NEXT_VERSION}" ]; then
            RELEASE_ARGS="${RELEASE_ARGS} next-version ${NEXT_VERSION}"
          fi
          if [ -n "${ADDITIONAL_RELEASE_ARGS}" ]; then
            RELEASE_ARGS="${RELEASE_ARGS} ${ADDITIONAL_RELEASE_ARGS}"
          fi
          sbt -v -Dfile.encoding=UTF8 "release ${RELEASE_ARGS}" < /dev/null

      - name: Create the GH Release
        run: |
          TAGS=$(git tag --sort=-creatordate | head -n 2)
          LATEST_TAG=$(echo "$TAGS" | sed -n '1p')
          PREVIOUS_TAG=$(echo "$TAGS" | sed -n '2p')
          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "Creating release notes between ${LATEST_TAG} and ${PREVIOUS_TAG}"
            gh release create --target "${FINAL_REF}" --generate-notes --notes-start-tag "${PREVIOUS_TAG}" "${LATEST_TAG}"
          else
            gh release create --target "${FINAL_REF}" --generate-notes "${LATEST_TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
